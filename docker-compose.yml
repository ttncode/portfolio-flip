services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  web:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
